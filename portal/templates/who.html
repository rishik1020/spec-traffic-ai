<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in &middot; Review Portal</title>
<link rel="stylesheet" href="/static/style.css">
</head><body class="centred">
  <form class="card" method="post" action="/who">
    <h1>SPEC Traffic AI</h1>

    <label for="officer">Your name</label>
    <input id="officer" name="officer" autocomplete="off" autofocus required

    <p class="muted">Recorded with every decision so reviewers can be compared.</p>
    <button type="submit">Start reviewing</button>
  </form>
</body></html>
