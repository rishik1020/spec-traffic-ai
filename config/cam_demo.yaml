# SPEC Traffic AI -- per-camera profile
#
# This file is the whole reason "junction camera" and "highway camera" are not
# separate codebases. Same binary, same perception pass -- what differs is which
# rules are switched on and the geometry they are calibrated against.

camera_id: demo01
location: "Demo junction, Hyderabad"

# UVH-26 rather than our DriveIndia fine-tune. Measured on kolkata.mp4, same
# frame, same 0.35 threshold: ours 11 boxes, UVH-26 52 -- and ours called a
# black SUV and a white sedan `bus` at 0.91 and 0.85. UVH-26 is trained on
# 2,800 Bengaluru Safe-City CCTV cameras, so an elevated enforcement view is
# its native domain. Fetch with: python scripts/fetch_uvh26.py
#
# It has no pedestrian class, which only matters to triple_riding. No rule
# enabled on this camera reads pedestrians.
weights: models/uvh26/UVH-26-MV-YOLOv11-S.pt
imgsz: 640
stride: 1              # process every Nth frame; raise to hit real-time budget

evidence:
  pre_seconds: 5.0     # history held before the violation
  post_seconds: 3.0    # captured after it
  downscale: 0.5       # buffer at half size; a 1080p buffer is ~800MB otherwise

rules:
  wrong_way:
    # Image coordinates -- y increases DOWNWARD.
    # [0, -1] = traffic should move toward the TOP of the frame.
    allowed_heading: [0, -1]
    tolerance_deg: 70       # how far off flow before it counts
    min_displacement: 40    # px; ignores parked vehicles whose "heading" is jitter
    min_frames: 8           # temporal consistency
    cooldown_frames: 200    # do not re-fire on the same vehicle

  # Enable as each is implemented:
  #
  # triple_riding:
  #   min_riders: 3
  #   min_overlap: 0.35
  #   min_frames: 10
  #
  # red_light_jump:
  #   stop_line: [[420, 700], [1500, 700]]
  #   min_frames: 3
  #
  # over_speeding:
  #   limit_kmph: 50
  #   homography_src: [[x1,y1],[x2,y2],[x3,y3],[x4,y4]]
  #   homography_dst_m: [[0,0],[3.5,0],[3.5,20],[0,20]]
