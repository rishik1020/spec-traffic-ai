camera_id: kolkata
# UVH-26, not our DriveIndia fine-tune. On this very footage, same frame, same
# inference settings (imgsz 1280, conf 0.25): ours found 10 vehicles, UVH-26
# found 56 -- and ours labelled 4 of its 10 `bus`, a black SUV among them at
# 0.75, on a frame holding one actual bus. That is the viewpoint domain gap in
# a single image. Reproduce with: python scripts/make_figures.py
#
# UVH-26 is trained on 26,646 frames from 2,800 Bengaluru Safe-City CCTV cameras, so an elevated view is
# its native domain rather than a shift away from it.
#
# COST: UVH-26 has 14 vehicle classes and NO pedestrian. Nothing enabled on
# this camera needs one. Any camera running triple_riding, or wanting
# pedestrians in the evidence, must stay on the DriveIndia weights.
weights: models/uvh26/UVH-26-MV-YOLOv11-S.pt
imgsz: 1280
stride: 1
evidence:
  pre_seconds: 1.5
  post_seconds: 1.5
  downscale: 0.5
calibration:
  lanes:
  - name: nearside
    polygon:
    - - 0
      - 480
    - - 358
      - 480
    - - 358
      - 1275
    - - 0
      - 1275
    heading:
    - 0.42
    - -0.91
    approach: west
  stop_lines:
  - name: s1
    line:
    - - 0
      - 520
    - - 715
      - 520
rules:
  wrong_way: {}
